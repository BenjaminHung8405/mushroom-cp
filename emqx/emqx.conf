##--------------------------------------------------------------------
## EMQX Configuration - Multi-Tenant IIoT (EMQX 5.3+)
##--------------------------------------------------------------------

node.name = "emqx@127.0.0.1"
node.cookie = "emqx_secret_cookie"
node.data_dir = "/opt/emqx/data"

## MQTT TCP Listener
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10240
}

## Dashboard & REST API
dashboard {
  listeners.http {
    bind = 18083
  }
}

## Anti-Flapping Detection
flapping_detect {
  enable = true
  window_time = 1m
  max_count = 25
  ban_time = 2m
}

## Authorization: File-based ACL
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = file
      enable = true
      path = "etc/acl.conf"
    }
  ]
}
