%% =====================================================================
%% EMQX Multi-Tenant Authorization Rules (acl.conf)
%% =====================================================================

%% 1. DevOps / System Admin - Full Superuser
{allow, {username, "mqtt_admin"}, all, ["#"]}.

%% 2. Mushroom Backend Service (Full tenant scope)
{allow, {username, "nestjs_backend"}, all, ["mushroom/#"]}.
{allow, {username, "nestjs_backend"}, subscribe, ["$SYS/#"]}.

%% 3. Aeroponics Backend Service (Full tenant scope)
{allow, {username, "aero_backend"}, all, ["aeroponics/#"]}.
{allow, {username, "aero_backend"}, subscribe, ["$SYS/#"]}.

%% 4. Aeroponics Dev / Client / Tuya Bridge Service
{allow, {username, "aero_client"}, all, ["aeroponics/#"]}.
{allow, {username, "tuya_bridge"}, all, ["aeroponics/sensors/#", "aeroponics/water/#"]}.
{allow, {username, "tuya_bridge_ph-w218-01"}, all, ["aeroponics/sensors/#", "aeroponics/water/#"]}.

%% 5. Mushroom Device Bootstrap / Provisioning
{allow, {username, "provision_node"}, publish, ["mushroom/provision/request"]}.
{allow, {username, "provision_node"}, subscribe, ["mushroom/provision/response/+"]}.

%% 6. Mushroom ESP32 Devices (Tenant isolation bound to authenticated username)
{allow, all, publish, ["mushroom/esp32/${username}/up/#", "mushroom/esp32/%u/up/#"]}.
{allow, all, publish, ["mushroom/esp32/${username}/status", "mushroom/esp32/%u/status"]}.
{allow, all, subscribe, ["mushroom/esp32/${username}/down/#", "mushroom/esp32/%u/down/#"]}.
{allow, all, publish, ["mushroom/device/${username}/status", "mushroom/device/%u/status"]}.
{allow, all, publish, ["mushroom/device/${username}/telemetry", "mushroom/device/%u/telemetry"]}.
{allow, all, subscribe, ["mushroom/device/${username}/setpoint", "mushroom/device/%u/setpoint"]}.

%% 7. Aeroponics ESP32 Devices & Nodes (Anti-Tampering & Wire Contract Facade v1)
%% 7a. Device-scoped topics bound to authenticated username
{allow, all, publish, [
  "aeroponics/device/${username}/status",
  "aeroponics/device/%u/status",
  "aeroponics/device/${username}/telemetry/#",
  "aeroponics/device/%u/telemetry/#",
  "aeroponics/device/${username}/ack/#",
  "aeroponics/device/%u/ack/#"
]}.
{allow, all, subscribe, [
  "aeroponics/device/${username}/command/#",
  "aeroponics/device/%u/command/#",
  "aeroponics/device/${username}/config/#",
  "aeroponics/device/%u/config/#",
  "aeroponics/command/node/+/override"
]}.

%% 7b. Interface & Wire Contract Facade Topics (v1 Gateway / Node Telemetry & Commands)
{allow, all, publish, [
  "aeroponics/v1/node/+/telemetry",
  "aeroponics/v1/node/+/ack",
  "aeroponics/v1/node/+/flow",
  "aeroponics/v1/node/+/event",
  "aeroponics/v1/node/+/fault",
  "aeroponics/v1/gateway/+/heartbeat",
  "aeroponics/v1/gateway/heartbeat",
  "aeroponics/node/+/telemetry",
  "aeroponics/node/+/ack",
  "aeroponics/node/+/flow",
  "aeroponics/node/+/event",
  "aeroponics/node/+/fault",
  "aeroponics/gateway/+/heartbeat",
  "aeroponics/gateway/heartbeat"
]}.
{allow, all, subscribe, [
  "aeroponics/v1/node/+/command",
  "aeroponics/v1/node/+/command/#",
  "aeroponics/v1/gateway/+/heartbeat",
  "aeroponics/v1/gateway/heartbeat",
  "aeroponics/node/+/command",
  "aeroponics/node/+/command/#",
  "aeroponics/gateway/+/heartbeat",
  "aeroponics/gateway/heartbeat"
]}.

%% 7c. Healthcheck Topics
{allow, all, publish, ["aeroponics/healthcheck", "aeroponics/healthcheck/#"]}.
{allow, all, subscribe, ["aeroponics/healthcheck", "aeroponics/healthcheck/#"]}.

%% 8. Security Default Deny
{deny, all, publish, ["#"]}.
{deny, all, subscribe, ["#"]}.
