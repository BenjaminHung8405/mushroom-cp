[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-codex-runner"
version = "0.1.0"
description = "Deterministic CLI orchestrator for Codex multi-agent plans"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
codex-runner = "codex_runner.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
