services:
  # ==========================================
  # 1. DATABASE: PostgreSQL + TimescaleDB
  # ==========================================
  mushroom-db:
    image: timescale/timescaledb:latest-pg15
    container_name: mushroom_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mushroom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-mushroom_iot_db}
    volumes:
      - ${DATA_PATH:-./data}/mushroom_postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mushroom_user} -d ${POSTGRES_DB:-mushroom_iot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - mushroom-network
    # NOTE: Port 5432 is NOT exposed to host. DB is only reachable
    # from within the mushroom-network Docker bridge network.

  # ==========================================
  # 2. MQTT BROKER: EMQX (Multi-Tenant IIoT)
  # ==========================================
  mushroom-mqtt:
    image: emqx/emqx:5.3.0
    container_name: mushroom_mqtt
    restart: always
    env_file:
      - .env
    environment:
      - "EMQX_NODE__NAME=emqx@127.0.0.1"
      - "EMQX_NODE__COOKIE=emqx_secret_cookie"
      - "EMQX_NODE__DATA_DIR=/opt/emqx/data"
      - "EMQX_DASHBOARD__DEFAULT_PASSWORD=${EMQX_ADMIN_PASS:-admin_mushroom_2026}"
      - "EMQX_LISTENERS__TCP__DEFAULT__BIND=0.0.0.0:1883"
      - "EMQX_LISTENERS__TCP__DEFAULT__MAX_CONNECTIONS=10240"
      - "EMQX_FLAPPING_DETECT__ENABLE=true"
      - "EMQX_FLAPPING_DETECT__WINDOW_TIME=1m"
      - "EMQX_FLAPPING_DETECT__MAX_COUNT=25"
      - "EMQX_FLAPPING_DETECT__BAN_TIME=2m"
      - "EMQX_AUTHORIZATION__NO_MATCH=deny"
      - "EMQX_AUTHORIZATION__DENY_ACTION=ignore"
      - "EMQX_AUTHORIZATION__SOURCES=[{type=file,enable=true,path=\"etc/acl.conf\"}]"
    ports:
      - "${MQTT_TCP_PORT:-10883}:1883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ${DATA_PATH:-./data}/mushroom_emqx_data:/opt/emqx/data
      - ${DATA_PATH:-./data}/mushroom_emqx_log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      mushroom-network:
        aliases:
          - mushroom_mqtt
          - mushroom-mqtt

  # ==========================================
  # 2b. EMQX USER INITIALIZER (One-shot sidecar)
  # ==========================================
  init-mqtt:
    image: alpine:latest
    container_name: mushroom_mqtt_init
    restart: "on-failure"
    depends_on:
      mushroom-mqtt:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - EMQX_HOST=mushroom-mqtt
      - EMQX_ADMIN_USER=${EMQX_ADMIN_USER:-admin}
      - EMQX_ADMIN_PASS=${EMQX_ADMIN_PASS:-admin_mushroom_2026}
      - MQTT_BACKEND_USER=${MQTT_BACKEND_USER:-nestjs_backend}
      - MQTT_BACKEND_PASS=${MQTT_BACKEND_PASS:-backend@123}
      - MQTT_BOOTSTRAP_USER=${MQTT_BOOTSTRAP_USER:-provision_node}
      - MQTT_BOOTSTRAP_SECRET=${MQTT_BOOTSTRAP_SECRET:-pass@123}
      - MQTT_ESP32_USER=${MQTT_ESP32_USER:-mushroom_s3_206ef1a1d324}
      - MQTT_ESP32_PASS=${MQTT_ESP32_PASS:-b55f5baf-21d4-4ee4-b37f-05945a0f8464}
      - MQTT_AERO_BACKEND_USER=aero_backend
      - MQTT_AERO_BACKEND_PASS=123456
      - MQTT_ADMIN_USER=mqtt_admin
      - MQTT_ADMIN_PASS=123456
      - MQTT_DEVICE_USER=esp32_device
      - MQTT_DEVICE_PASS=123456
    volumes:
      - ./emqx/init-users.sh:/init-users.sh:ro
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache curl jq && sh /init-users.sh"]
    networks:
      - mushroom-network

  # ==========================================
  # 3. TIME-SERIES DATABASE: InfluxDB v2
  # ==========================================
  mushroom-influxdb:
    image: influxdb:2.7-alpine
    container_name: mushroom_influxdb
    restart: always
    env_file:
      - .env
    ports:
      - "${INFLUXDB_HOST_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - ${DATA_PATH:-./data}/mushroom_influxdb_data:/var/lib/influxdb2
      - ${DATA_PATH:-./data}/mushroom_influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - mushroom-network

  # ==========================================
  # 4. BACKEND: NestJS Application
  # ==========================================
  mushroom-backend:
    build:
      context: ./mushroom-backend
      dockerfile: Dockerfile
    container_name: mushroom_backend
    restart: always
    command: sh -c "pnpm run migration:run && pnpm run start:dev"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CI=true
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - SYSTEM_JWT_SECRET=${SYSTEM_JWT_SECRET:?SYSTEM_JWT_SECRET is required}
      - TUNING_SSE_TICKET_SECRET=${TUNING_SSE_TICKET_SECRET:?TUNING_SSE_TICKET_SECRET is required}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mushroom_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@mushroom-db:5432/${POSTGRES_DB:-mushroom_iot_db}
      - MQTT_HOST=mushroom-mqtt
      - MQTT_PORT=1883
      - MQTT_USERNAME=${MQTT_BACKEND_USER:-nestjs_backend}
      - MQTT_PASSWORD=${MQTT_BACKEND_PASS:?MQTT_BACKEND_PASS is required}
      - OFFLINE_SYNC_MQTT_URL=mqtt://mushroom-mqtt:1883
      - OFFLINE_SYNC_MQTT_USERNAME=${MQTT_BACKEND_USER:-nestjs_backend}
      - OFFLINE_SYNC_MQTT_PASSWORD=${MQTT_BACKEND_PASS:?MQTT_BACKEND_PASS is required}
      - OFFLINE_SYNC_MQTT_CLIENT_ID=${OFFLINE_SYNC_MQTT_CLIENT_ID:-mushroom_offline_sync}
      - INFLUXDB_URL=http://mushroom-influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-mushroom}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:?INFLUXDB_BUCKET is required}
      - INFLUXDB_ANALYTICS_BUCKET=${INFLUXDB_ANALYTICS_BUCKET:?INFLUXDB_ANALYTICS_BUCKET is required}
      - REDIS_URL=${REDIS_URL:-redis://mushroom-redis:6379}
      - AUTH_ENFORCEMENT_MODE=${AUTH_ENFORCEMENT_MODE:-enforced}
      - AUTH_BOOTSTRAP_ADMIN_EMAIL=${AUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      - AUTH_BOOTSTRAP_ADMIN_PASSWORD=${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      mushroom-db:
        condition: service_healthy
      mushroom-influxdb:
        condition: service_healthy
      mushroom-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - mushroom-network
    volumes:
      - ./mushroom-backend:/usr/src/app
      - /usr/src/app/node_modules

  mushroom-redis:
    image: redis:7.4-alpine
    container_name: mushroom_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - mushroom-network

  # ==========================================
  # 5. FRONTEND: Next.js (mushroom-ui)
  # ==========================================
  mushroom-ui:
    build:
      context: ./mushroom-ui
      dockerfile: Dockerfile
    container_name: mushroom_ui
    restart: always
    ports:
      - "${UI_HOST_PORT:-6001}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - CI=true
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/api/backend}
      - API_INTERNAL_URL=http://mushroom-backend:3001
      - SYSTEM_JWT_SECRET=${SYSTEM_JWT_SECRET:?SYSTEM_JWT_SECRET is required}
      - AUTH_ENFORCEMENT_MODE=${AUTH_ENFORCEMENT_MODE:-enforced}
      - NEXT_PUBLIC_DEVICE_ID=${NEXT_PUBLIC_DEVICE_ID:-}
    depends_on:
      mushroom-backend:
        condition: service_healthy
    networks:
      - mushroom-network

networks:
  mushroom-network:
    name: mushroom-cp_mushroom-network
    driver: bridge
